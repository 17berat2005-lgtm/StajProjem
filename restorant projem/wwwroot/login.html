<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kanka Restoran | Giris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-overlay">
        <div class="login-panel admin-panel">
            <div class="login-logo">
                <span class="logo-icon">::</span>
                <span class="logo-text">Kanka Restoran</span>
            </div>
            <h3>Hos geldin kanka!</h3>
            <small>Lutfen kullanici adi ve sifrenle panele giris yap.</small>

            <div class="form-row login-form-column">
                <input type="text" id="user" placeholder="Kullanici Adi">
                <input type="password" id="pass" placeholder="Sifre">
                <button id="btn-login" class="btn-login" onclick="login()">Giris Yap</button>
            </div>

            <a href="register.html" class="login-link">
                Yeni misafir misin? <span>Kayit Ol</span>
            </a>
        </div>
    </div>
    <script>
        function login() {
            const data = { username: document.getElementById('user').value, password: document.getElementById('pass').value };
            fetch('/api/Auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
                .then(res => res.ok ? res.json() : Promise.reject())
                .then(user => {
                    localStorage.setItem('userRole', user.role);
                    localStorage.setItem('userName', user.username);
                    localStorage.setItem('userId', user.id || user.ID);
                    window.location.href = 'index.html';
                }).catch(() => alert("Hatali giris kanka!"));
        }
    </script>
</body>
</html>
