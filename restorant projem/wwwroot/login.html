<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kanka Restoran | Giriş</title>
    <style>
        body {
            font-family: sans-serif;
            background: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🍔 Giriş Yap</h2>
        <input type="text" id="user" placeholder="Kullanıcı Adı">
        <input type="password" id="pass" placeholder="Şifre">
        <button onclick="login()">GİRİŞ YAP</button>
        <a href="register.html" style="display:block; margin-top:15px; color:#2c3e50; text-decoration:none; font-size:14px;">Yeni misafir misin? Kayıt Ol</a>
    </div>
    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
