<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanka Restoran | Yönetim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2 id="main-title">🔥 Kanka Restoran</h2>
        <div class="nav-actions">
            <span id="user-display" style="color: white; margin-right: 15px;"></span>
            <button onclick="goCart()" class="btn-logout" style="background:#f97316; margin-right:8px;">Sepet</button>
            <button onclick="logout()" class="btn-logout">Çıkış</button>
        </div>
    </nav>

    <div class="container">
        <div class="admin-panel" id="admin-area">
            <h3 id="form-title">➕ Yeni Ürün Ekle</h3>
            <div class="form-row">
                <input type="text" id="yName" placeholder="Yemek Adı">
                <input type="text" id="yDesc" placeholder="Açıklama">
                <input type="number" id="yPrice" placeholder="Fiyat">
                <input type="number" id="yEnergy" placeholder="Kalori">
                <button id="btn-action" onclick="handleAction()">SİSTEME KAYDET</button>
            </div>
        </div>

        <!-- Sadece SuperAdmin'e görünecek kullanıcı rol yönetimi alanı -->
        <div class="admin-panel" id="role-area" style="margin-top:20px; display:none;">
            <h3>👤 Kullanıcı Rolleri</h3>
            <div id="user-roles-content" style="overflow-x:auto; margin-top:10px; font-size:14px;">
                Loading users...
            </div>
        </div>

        <div class="search-container" style="text-align:center; margin: 25px 0;">
            <input type="text" id="searchInput" onkeyup="filterMenu()" placeholder="🔍 Yemek adı ara..."
                   style="padding:12px; width:350px; border-radius:25px; border:1px solid #ddd; outline:none; font-size:16px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        </div>

        <h2 class="list-title">Menü Listesi</h2>
        <div id="menu-listesi" class="menu-grid">Menü yükleniyor...</div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
