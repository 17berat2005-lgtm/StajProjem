<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanka Restoran | Yönetim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2 id="main-title">🔥 Kanka Restoran</h2>
        <div class="nav-actions">
            <span id="user-display" style="color: white; margin-right: 15px;"></span>
            <button onclick="goCart()" class="btn-logout" style="background:#f97316; margin-right:8px;">Sepet</button>
            <button onclick="logout()" class="btn-logout">Çıkış</button>
        </div>
    </nav>

    <div class="container">
        <div class="search-container" style="text-align:center; margin: 25px 0;">
            <input type="text" id="searchInput" onkeyup="filterMenu()" placeholder="🔍 Yemek adı ara..."
                   style="padding:12px; width:350px; border-radius:25px; border:1px solid #ddd; outline:none; font-size:16px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        </div>

        <h2 class="list-title">Menü Listesi</h2>
        <div id="menu-listesi" class="menu-grid">Menü yükleniyor...</div>

        <!-- Menü kartı için HTML template (JS sadece dolduracak) -->
        <template id="menu-card-template">
            <div class="card">
                <div class="card-image">
                    <img src="" alt="">
                </div>
                <h3>🍔 <span class="card-name"></span></h3>
                <p class="card-desc"></p>
                <p class="price-text">💰 Fiyat: <span class="card-price"></span> TL</p>
                <small class="card-cal">🔥 Kalori: <span class="card-cal-value"></span> kcal</small><br>
                <small class="card-date" style="color: #888; font-size: 11px;">🗓️ Eklenme: <span class="card-date-value"></span></small>
                <div class="btn-group"></div>
            </div>
        </template>
    </div>

    <!-- Ürün düzenleme popup (Admin için) -->
    <div id="edit-modal-overlay" class="modal-overlay modal-hidden">
        <div class="modal">
            <h3>Ürünü Düzenle</h3>
            <p>Ürün bilgilerini güncelle.</p>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <input type="text" id="edit-name" placeholder="Yemek Adı">
                <input type="text" id="edit-desc" placeholder="Açıklama">
                <input type="number" id="edit-price" placeholder="Fiyat">
                <input type="number" id="edit-energy" placeholder="Kalori">
            </div>
            <div class="modal-actions">
                <button id="edit-cancel" class="btn-secondary">Vazgeç</button>
                <button id="edit-save" class="btn-edit">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Malzeme çıkarma popup (Sepete eklerken) -->
    <div id="ingredient-modal-overlay" class="modal-overlay modal-hidden">
        <div class="modal">
            <h3 id="ingredient-title">Malzeme Çıkar</h3>
            <p>İstemediğin malzemeleri işaretle, biz mutfağa not düşelim.</p>
            <div id="ingredient-list"></div>
            <div class="modal-actions">
                <button id="ingredient-cancel" class="btn-secondary">Vazgeç</button>
                <button id="ingredient-confirm" class="btn-edit" style="background:#22c55e;">Sepete Ekle</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
