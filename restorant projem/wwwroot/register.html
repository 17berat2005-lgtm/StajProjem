<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanka Restoran | Kayıt Ol</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        .box {
            background: #ffffff;
            padding: 32px 28px;
            border-radius: 18px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
        }

        .box h2 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .box p.subtitle {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 14px;
            color: #7f8c8d;
        }

        .box label {
            display: block;
            text-align: left;
            font-size: 13px;
            color: #555;
            margin-top: 10px;
            margin-bottom: 4px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #dcdfe3;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
        }

        input:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.25);
            transform: translateY(-1px);
        }

        .error-text {
            margin-top: 6px;
            font-size: 13px;
            color: #e11d48;
            text-align: left;
            min-height: 18px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            background: #2ecc71;
            color: #ffffff;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background: #27ae60;
            box-shadow: 0 10px 25px rgba(46, 204, 113, 0.45);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.35);
        }

        .login-link {
            display: block;
            margin-top: 18px;
            color: #2c3e50;
            text-decoration: none;
            font-size: 14px;
        }

        .login-link span {
            font-weight: 600;
        }

        .login-link:hover span {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>📝 Kayıt Ol</h2>
        <p class="subtitle">Kanka Restoran hesabını oluştur, siparişlerini kolayca yönet.</p>

        <form onsubmit="event.preventDefault(); kayit();">
            <label for="rUser">Kullanıcı Adı</label>
            <input type="text" id="rUser" placeholder="örn. kanka.musteri" autocomplete="username">

            <label for="rPass">Şifre</label>
            <input type="password" id="rPass" placeholder="En az 4 karakter" autocomplete="new-password">

            <div id="register-error" class="error-text"></div>

            <button type="submit">Hesap Oluştur</button>
        </form>

        <a class="login-link" href="login.html">
            Zaten hesabın var mı? <span>Giriş Yap</span>
        </a>
    </div>

    <script src="js/common.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
