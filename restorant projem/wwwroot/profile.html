<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanka Restoran | Profilim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h2>👤 Profilim</h2>
        <div class="nav-actions">
            <span id="user-display" class="nav-user-text"></span>
            <button onclick="window.location.href='index.html'" class="btn-logout btn-cart">Menü</button>
            <button onclick="goOrders()" class="btn-logout" style="background:rgba(34,197,94,0.85);">Siparişlerim</button>
            <button onclick="logout()" class="btn-logout">Çıkış</button>
        </div>
    </nav>

    <div class="container">
        <div class="admin-panel" style="margin-bottom:20px;">
            <h3>Hoş geldin, <span id="profile-name">Misafir</span> 👋</h3>
            <p style="font-size:14px; color:#4b5563; margin-top:6px;">
                Buradan temel bilgilerini görebilir, sepetine ve geçmiş siparişlerine hızlıca gidebilirsin.
            </p>
        </div>

        <div class="admin-panel">
            <h3>Hızlı Erişim</h3>
            <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;">
                <button onclick="window.location.href='index.html'" class="btn-edit" style="background:#f97316;">Menüye Git</button>
                <button onclick="window.location.href='cart.html'" class="btn-edit" style="background:#22c55e;">Sepetim</button>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-col">
                <h4>Kanka Restoran</h4>
                <p>Profilinden sipariş geçmişine ve menüye her zaman ulaşabilirsin.</p>
            </div>
        </div>
        <div class="footer-bottom">
            <span>© <span id="footer-year-profile"></span> Kanka Restoran.</span>
        </div>
    </footer>

    <script src="js/common.js"></script>
    <script>
        const nameFromStorage = localStorage.getItem('userName') || localStorage.getItem('username');
        const profileNameEl = document.getElementById('profile-name');
        const userDisplay = document.getElementById('user-display');
        if (profileNameEl) {
            profileNameEl.textContent = nameFromStorage || 'Misafir';
        }
        if (userDisplay) {
            userDisplay.textContent = nameFromStorage ? `Merhaba, ${nameFromStorage}` : 'Merhaba, Misafir';
        }

        function goOrders() {
            window.location.href = 'cart.html';
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        document.getElementById('footer-year-profile').textContent = new Date().getFullYear();
    </script>
</body>
</html>
